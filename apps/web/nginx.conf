server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # HTML must be revalidated so browsers discover new asset URLs after deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files /index.html =404;
    }

    # Asset URLs carry content hashes. Reusing unchanged files is safe.
    location ~ ^/(app\\.js|styles\\.css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
