deploymentMode: Monolithic
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: game_lab_loki_index_
          period: 24h
  limits_config:
    retention_period: 168h
    allow_structured_metadata: true
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  storage:
    type: filesystem
singleBinary:
  enabled: true
  replicas: 1
  persistence:
    enabled: true
    size: 8Gi
gateway:
  enabled: false
lokiCanary:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
rollout_operator:
  enabled: false
