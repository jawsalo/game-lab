replicas: 1
tempo:
  reportingEnabled: false
  multitenancyEnabled: false
  retention: 72h
  storage:
    trace:
      backend: local
      local:
        path: /var/tempo/traces
      wal:
        path: /var/tempo/wal
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
persistence:
  enabled: true
  size: 5Gi
