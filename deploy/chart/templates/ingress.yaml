{{- if and .Values.modules.web.enabled .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "game-lab.name" . }}-web
  labels:
    {{- include "game-lab.labels" . | nindent 4 }}
  {{- if and .Values.ingress.tls.enabled .Values.ingress.tls.clusterIssuer }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.clusterIssuer | quote }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ include "game-lab.webHost" . | quote }}
      secretName: {{ include "game-lab.name" . }}-web-tls
  {{- end }}
  rules:
    - host: {{ include "game-lab.webHost" . | quote }}
      http:
        paths:
          {{- if .Values.modules.api.enabled }}
          - path: {{ .Values.modules.api.path }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "game-lab.name" . }}-api
                port:
                  name: http
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "game-lab.name" . }}-web
                port:
                  name: http
{{- end }}
