platform:
  name: game-lab
  environment: default
  baseDomain: example.invalid

modules:
  web:
    enabled: false
    subdomain: games
    hostname: ""
    replicas: 1
    image:
      repository: ghcr.io/jawsalo/game-lab-web
      tag: phase-1-app-foundation
      pullPolicy: IfNotPresent
    service:
      port: 80
      containerPort: 8080
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 100m
        memory: 64Mi

  api:
    enabled: false
    path: /api
    appVersion: dev
    replicas: 1
    image:
      repository: ghcr.io/jawsalo/game-lab-api
      tag: phase-1-app-foundation
      pullPolicy: IfNotPresent
    service:
      port: 80
      containerPort: 8080
    telemetry:
      serviceName: game-lab-api
      otlpEndpoint: ""
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi

  mcp:
    enabled: false
    subdomain: mcp
    hostname: ""

  observability:
    enabled: false
    subdomain: grafana
    hostname: ""

ingress:
  enabled: true
  className: traefik
  tls:
    enabled: true
    clusterIssuer: letsencrypt-prod
