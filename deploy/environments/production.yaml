platform:
  name: game-lab
  environment: production
  baseDomain: phobosandeimos.com

modules:
  web:
    enabled: true
    subdomain: games
    hostname: ""
    image:
      repository: ghcr.io/jawsalo/game-lab-web
      tag: sha-ec3db73
      pullPolicy: IfNotPresent

  api:
    enabled: true
    path: /api
    appVersion: ec3db73
    image:
      repository: ghcr.io/jawsalo/game-lab-api
      tag: sha-ec3db73
      pullPolicy: IfNotPresent
    telemetry:
      serviceName: game-lab-api
      otlpEndpoint: http://alloy.observability.svc.cluster.local:4317

  mcp:
    enabled: false
    subdomain: mcp
    hostname: ""

  observability:
    enabled: false
    subdomain: grafana
    hostname: ""

ingress:
  enabled: true
  className: traefik
  tls:
    enabled: true
    clusterIssuer: letsencrypt-prod
