name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  configuration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
      - run: python -m pip install -r requirements.txt -r apps/api/requirements.txt
      - name: Install pinned Helm
        env:
          HELM_VERSION: v4.2.4
        run: |
          set -euo pipefail
          archive="helm-${HELM_VERSION}-linux-amd64.tar.gz"
          curl --fail --location --silent --show-error --output "$archive" "https://get.helm.sh/$archive"
          curl --fail --location --silent --show-error --output "$archive.sha256sum" "https://get.helm.sh/$archive.sha256sum"
          checksum="$(awk '{print $1}' "$archive.sha256sum")"
          [[ "$checksum" =~ ^[[:xdigit:]]{64}$ ]]
          printf '%s  %s\n' "$checksum" "$archive" | sha256sum --check --status
          tar --extract --gzip --file "$archive" linux-amd64/helm
          sudo install --mode=0755 linux-amd64/helm /usr/local/bin/helm
          helm version --short
      - name: Lint and render Helm chart
        run: |
          helm lint deploy/chart --values deploy/environments/example.yaml
          helm lint deploy/chart --values deploy/environments/production.yaml
          helm template game-lab deploy/chart --namespace game-lab --values deploy/environments/production.yaml > /dev/null
      - run: make validate
