name: Build application images

on:
  workflow_dispatch:
  # Keep PR check names available for branch protection, including docs-only PRs.
  pull_request:
  push:
    branches:
      - main
      - phase-2-grim-dawn-catalog
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "deploy/**"
      - "scripts/**"
      - "Makefile"
      - ".github/workflows/build-images.yml"

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install validation and API dependencies
        run: python -m pip install -r requirements.txt -r apps/api/requirements.txt

      - name: Validate repository
        run: make validate

  build:
    name: Build ${{ matrix.name }} (no publish)
    if: github.event_name != 'push'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: apps/api
          - name: web
            context: apps/web

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/game-lab-${{ matrix.name }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build image without publishing
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: false
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  publish:
    name: Publish ${{ matrix.name }}
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: apps/api
          - name: web
            context: apps/web

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/game-lab-${{ matrix.name }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  verify-deployment:
    name: Verify production deployment
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.GAME_LAB_AUTO_DEPLOY == 'true' && vars.GAME_LAB_BASE_URL != '' }}
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BASE_URL: ${{ vars.GAME_LAB_BASE_URL }}
    steps:
      - name: Check out the commit whose images were published
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Wait for the VPS to report this commit
        shell: bash
        run: |
          set -euo pipefail
          expected_version="${GITHUB_SHA:0:7}"
          deadline=$((SECONDS + 900))
          while (( SECONDS < deadline )); do
            metadata="$(curl --fail --silent --show-error --max-time 10 "$BASE_URL/api" 2>/dev/null || true)"
            version="$(python3 -c 'import json,sys; print(json.loads(sys.stdin.read()).get("version", ""))' <<<"$metadata" 2>/dev/null || true)"
            if [[ "$version" == "$expected_version" ]]; then
              echo "Production reports API version $version."
              exit 0
            fi
            echo "Waiting for production version $expected_version; current version: ${version:-unavailable}."
            sleep 15
          done
          echo "Production did not report $expected_version within 15 minutes." >&2
          exit 1

      - name: Run production smoke tests
        run: scripts/smoke-test.sh "$BASE_URL" "${GITHUB_SHA:0:7}"
